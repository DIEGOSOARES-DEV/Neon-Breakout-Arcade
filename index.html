<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEON BREAKOUT // Cyber Arcade</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Orbitron & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #060811;
      color: #e2e8f0;
      touch-action: none;
    }
    .font-arcade {
      font-family: 'Orbitron', monospace;
    }
    .retro-grid {
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .neon-frame {
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3), inset 0 0 18px rgba(56, 189, 248, 0.15);
    }
    .neon-text-cyan {
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
    }
    .neon-text-pink {
      text-shadow: 0 0 8px rgba(244, 63, 94, 0.8), 0 0 20px rgba(244, 63, 94, 0.4);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5 retro-grid select-none overflow-hidden">

  <header class="w-full max-w-xl flex flex-col gap-2.5">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl text-cyan-400"><i class="fa-solid fa-cubes-stacked"></i></span>
        <h1 class="font-arcade font-black text-lg sm:text-2xl tracking-wider text-cyan-400 neon-text-cyan">
          NEON<span class="text-rose-500 neon-text-pink">BREAKOUT</span>
        </h1>
      </div>

      <div class="flex items-center gap-2">
        <button id="soundBtn" class="p-2.5 rounded-xl bg-slate-900/90 border border-slate-800 text-cyan-400 hover:border-cyan-500/50 transition" title="Som">
          <i id="soundIcon" class="fa-solid fa-volume-high"></i>
        </button>
        <button id="pauseBtn" class="p-2.5 rounded-xl bg-slate-900/90 border border-slate-800 text-slate-300 hover:text-cyan-400 transition" title="Pausar">
          <i id="pauseIcon" class="fa-solid fa-pause"></i>
        </button>
      </div>
    </div>

    <!-- Placar Superior -->
    <div class="grid grid-cols-4 gap-2 text-center">
      <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-2">
        <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block">Pontos</span>
        <span id="scoreEl" class="font-arcade text-sm sm:text-lg font-bold text-cyan-400">0000</span>
      </div>
      <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-2">
        <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block">Recorde</span>
        <span id="highScoreEl" class="font-arcade text-sm sm:text-lg font-bold text-amber-400">0000</span>
      </div>
      <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-2">
        <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block">Vidas</span>
        <span id="livesEl" class="font-arcade text-sm sm:text-lg font-bold text-rose-500">❤️❤️❤️</span>
      </div>
      <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-2">
        <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block">Fase</span>
        <span id="levelEl" class="font-arcade text-sm sm:text-lg font-bold text-emerald-400">1</span>
      </div>
    </div>
  </header>

  <main class="w-full max-w-xl flex-1 flex items-center justify-center my-2 relative">
    <div class="relative w-full aspect-[4/3] max-h-[480px] bg-slate-950 rounded-2xl border-2 border-cyan-500/40 neon-frame overflow-hidden flex items-center justify-center">
      
      <canvas id="breakoutCanvas" width="600" height="450" class="w-full h-full block cursor-none"></canvas>

      <!-- Overlay Inicial / Pausa / Fim de Jogo -->
      <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center transition-opacity duration-300">
        <div class="max-w-xs space-y-4">
          <div class="w-16 h-16 mx-auto rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-3xl animate-bounce">
            <i id="overlayIcon" class="fa-solid fa-rocket"></i>
          </div>
          <h2 id="overlayTitle" class="font-arcade text-2xl sm:text-3xl font-black text-cyan-400 neon-text-cyan">
            NEON BREAKOUT
          </h2>
          <p id="overlayDesc" class="text-xs sm:text-sm text-slate-300 leading-relaxed">
            Mova o mouse, deslize o dedo ou use as setas para rebater a esfera de plasma e destruir os blocos! Colete cápsulas de <span class="text-amber-400 font-bold">Power-Up</span>!
          </p>
          <button id="actionBtn" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-arcade font-extrabold text-sm uppercase tracking-widest shadow-lg shadow-cyan-500/30 transition active:scale-95">
            Iniciar Partida
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="w-full max-w-xl flex flex-col items-center gap-2">
    <!-- Botões Touch para Mobile -->
    <div class="flex items-center justify-center gap-4 w-full sm:hidden">
      <button id="leftTouchBtn" class="flex-1 py-3 bg-slate-900 border border-slate-700 rounded-xl text-cyan-400 active:bg-cyan-500/20 text-lg">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button id="launchTouchBtn" class="px-5 py-3 bg-rose-500/20 border border-rose-500/40 rounded-xl text-rose-300 font-arcade text-xs font-bold">
        LANÇAR
      </button>
      <button id="rightTouchBtn" class="flex-1 py-3 bg-slate-900 border border-slate-700 rounded-xl text-cyan-400 active:bg-cyan-500/20 text-lg">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <div class="text-[11px] text-slate-500 flex items-center gap-2">
      <span><i class="fa-solid fa-keyboard text-slate-400"></i> Mouse, Toque ou Setas <kbd class="px-1.5 py-0.5 bg-slate-900 border border-slate-800 rounded text-slate-300">◀</kbd> <kbd class="px-1.5 py-0.5 bg-slate-900 border border-slate-800 rounded text-slate-300">▶</kbd></span>
      <span>•</span>
      <span><kbd class="px-1.5 py-0.5 bg-slate-900 border border-slate-800 rounded text-slate-300">Espaço</kbd> Lança a bola</span>
    </div>
  </footer>

  <script>
    class ArcadeSound {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      tone(freq, type = 'sine', duration = 0.08, vol = 0.12) {
        if (this.muted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      paddle() { this.tone(340, 'triangle', 0.07, 0.15); }
      wall() { this.tone(240, 'sine', 0.05, 0.1); }
      brick(row) { this.tone(420 + row * 65, 'square', 0.08, 0.12); }
      powerup() {
        this.tone(523, 'triangle', 0.08, 0.15);
        setTimeout(() => this.tone(659, 'triangle', 0.08, 0.15), 60);
        setTimeout(() => this.tone(784, 'sine', 0.14, 0.15), 120);
      }
      loseLife() {
        this.tone(250, 'sawtooth', 0.18, 0.18);
        setTimeout(() => this.tone(140, 'sawtooth', 0.3, 0.2), 120);
      }
    }

    const canvas = document.getElementById('breakoutCanvas');
    const ctx = canvas.getContext('2d');
    const sfx = new ArcadeSound();

    const W = canvas.width;
    const H = canvas.height;

    let score = 0;
    let highScore = parseInt(localStorage.getItem('neonBreakoutHigh') || '0', 10);
    let lives = 3;
    let level = 1;
    let isRunning = false;
    let isPaused = false;

    const scoreEl = document.getElementById('scoreEl');
    const highScoreEl = document.getElementById('highScoreEl');
    const livesEl = document.getElementById('livesEl');
    const levelEl = document.getElementById('levelEl');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const overlayIcon = document.getElementById('overlayIcon');
    const actionBtn = document.getElementById('actionBtn');

    highScoreEl.textContent = String(highScore).padStart(4, '0');

    const paddle = {
      w: 96,
      baseW: 96,
      h: 14,
      x: W / 2 - 48,
      y: H - 28,
      speed: 7,
      dx: 0,
      color: '#22d3ee',
      wideTimer: 0
    };

    let balls = [];
    let bricks = [];
    let particles = [];
    let powerUps = [];

    const BRICK_COLORS = [
      '#f43f5e', // Rosa Neon
      '#fb923c', // Laranja
      '#facc15', // Amarelo
      '#4ade80', // Verde
      '#22d3ee', // Ciano
      '#a855f7'  // Roxo
    ];

    function resetBall() {
      balls = [{
        x: paddle.x + paddle.w / 2,
        y: paddle.y - 10,
        r: 7,
        vx: 0,
        vy: 0,
        speed: 5 + Math.min(2.5, (level - 1) * 0.4),
        stuck: true,
        trail: []
      }];
    }

    function launchBalls() {
      balls.forEach(b => {
        if (b.stuck) {
          b.stuck = false;
          const angle = -Math.PI / 2 + (Math.random() * 0.5 - 0.25);
          b.vx = Math.cos(angle) * b.speed;
          b.vy = Math.sin(angle) * b.speed;
          sfx.paddle();
        }
      });
    }

    function buildBricks() {
      bricks = [];
      const rows = Math.min(6, 4 + Math.floor(level / 2));
      const cols = 8;
      const pad = 8;
      const offsetTop = 45;
      const offsetLeft = 24;
      const bw = (W - offsetLeft * 2 - pad * (cols - 1)) / cols;
      const bh = 22;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const hp = (r === 0 && level > 1) ? 2 : 1;
          bricks.push({
            x: offsetLeft + c * (bw + pad),
            y: offsetTop + r * (bh + pad),
            w: bw,
            h: bh,
            hp: hp,
            maxHp: hp,
            row: rows - r,
            color: BRICK_COLORS[r % BRICK_COLORS.length]
          });
        }
      }
    }

    function spawnParticles(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3.5 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: Math.random() * 3 + 1.5,
          alpha: 1,
          color
        });
      }
    }

    function updateHUD() {
      scoreEl.textContent = String(score).padStart(4, '0');
      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = String(highScore).padStart(4, '0');
        localStorage.setItem('neonBreakoutHigh', String(highScore));
      }
      livesEl.textContent = '❤️'.repeat(Math.max(0, lives)) || '💀';
      levelEl.textContent = level;
    }

    function update() {
      if (!isRunning || isPaused) return;

      // Movimento da barra
      paddle.x += paddle.dx;
      if (paddle.x < 8) paddle.x = 8;
      if (paddle.x + paddle.w > W - 8) paddle.x = W - 8 - paddle.w;

      // Temporizador de barra larga
      if (paddle.wideTimer > 0) {
        paddle.wideTimer--;
        if (paddle.wideTimer === 0) paddle.w = paddle.baseW;
      }

      // Atualização das bolas
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        if (b.stuck) {
          b.x = paddle.x + paddle.w / 2;
          b.y = paddle.y - b.r - 2;
          continue;
        }

        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 7) b.trail.shift();

        b.x += b.vx;
        b.y += b.vy;

        // Paredes laterais e topo
        if (b.x - b.r < 0) { b.x = b.r; b.vx *= -1; sfx.wall(); }
        if (b.x + b.r > W) { b.x = W - b.r; b.vx *= -1; sfx.wall(); }
        if (b.y - b.r < 0) { b.y = b.r; b.vy *= -1; sfx.wall(); }

        // Colisão com a barra (Paddle)
        if (
          b.vy > 0 &&
          b.y + b.r >= paddle.y &&
          b.y - b.r <= paddle.y + paddle.h &&
          b.x >= paddle.x - 4 &&
          b.x <= paddle.x + paddle.w + 4
        ) {
          const hitPos = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          const maxBounceAngle = Math.PI / 3; // 60 graus
          const bounceAngle = hitPos * maxBounceAngle;
          b.vx = b.speed * Math.sin(bounceAngle);
          b.vy = -Math.abs(b.speed * Math.cos(bounceAngle));
          sfx.paddle();
          spawnParticles(b.x, paddle.y, '#22d3ee', 6);
        }

        // Colisão com blocos
        for (let j = bricks.length - 1; j >= 0; j--) {
          const br = bricks[j];
          if (
            b.x + b.r > br.x &&
            b.x - b.r < br.x + br.w &&
            b.y + b.r > br.y &&
            b.y - b.r < br.y + br.h
          ) {
            b.vy *= -1;
            br.hp--;
            sfx.brick(br.row);
            spawnParticles(b.x, b.y, br.color, 12);

            if (br.hp <= 0) {
              score += br.row * 10;
              // Chance de soltar Power-Up (22%)
              if (Math.random() < 0.22) {
                const types = ['WIDE', 'MULTI', 'LIFE'];
                const t = types[Math.floor(Math.random() * types.length)];
                powerUps.push({
                  x: br.x + br.w / 2,
                  y: br.y + br.h / 2,
                  type: t,
                  vy: 2.3
                });
              }
              bricks.splice(j, 1);
              updateHUD();
            }
            break;
          }
        }

        // Caiu no fundo
        if (b.y - b.r > H) {
          balls.splice(i, 1);
        }
      }

      // Se todas as bolas caíram
      if (balls.length === 0) {
        lives--;
        sfx.loseLife();
        updateHUD();
        if (lives <= 0) {
          endGame();
          return;
        } else {
          paddle.w = paddle.baseW;
          resetBall();
        }
      }

      // Se limpou todos os blocos (Próxima Fase)
      if (bricks.length === 0) {
        level++;
        sfx.powerup();
        updateHUD();
        buildBricks();
        resetBall();
      }

      // Atualizar Power-Ups
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += p.vy;
        if (
          p.y >= paddle.y - 8 &&
          p.y <= paddle.y + paddle.h + 8 &&
          p.x >= paddle.x &&
          p.x <= paddle.x + paddle.w
        ) {
          sfx.powerup();
          applyPowerUp(p.type);
          powerUps.splice(i, 1);
        } else if (p.y > H + 20) {
          powerUps.splice(i, 1);
        }
      }

      // Atualizar Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= 0.03;
        if (pt.alpha <= 0) particles.splice(i, 1);
      }
    }

    function applyPowerUp(type) {
      score += 25;
      if (type === 'WIDE') {
        paddle.w = 144;
        paddle.wideTimer = 600; // ~10 segundos
      } else if (type === 'MULTI') {
        const ref = balls[0];
        if (ref) {
          balls.push({
            x: ref.x,
            y: ref.y,
            r: 7,
            vx: -ref.vx || 3,
            vy: -Math.abs(ref.vy || -4),
            speed: ref.speed,
            stuck: false,
            trail: []
          });
        }
      } else if (type === 'LIFE') {
        lives = Math.min(5, lives + 1);
      }
      updateHUD();
    }

    function draw() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, W, H);

      // Desenhar Blocos Neon
      bricks.forEach(br => {
        ctx.save();
        ctx.fillStyle = br.color;
        ctx.shadowColor = br.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(br.x, br.y, br.w, br.h, 5);
        ctx.fill();

        if (br.hp > 1) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.restore();
      });

      // Desenhar Barra (Paddle)
      ctx.save();
      ctx.fillStyle = paddle.wideTimer > 0 ? '#facc15' : paddle.color;
      ctx.shadowColor = paddle.wideTimer > 0 ? '#facc15' : paddle.color;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
      ctx.fill();
      ctx.restore();

      // Desenhar Bolas e Rastro
      balls.forEach(b => {
        b.trail.forEach((t, idx) => {
          ctx.save();
          ctx.globalAlpha = (idx + 1) / b.trail.length * 0.35;
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(t.x, t.y, b.r * 0.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Desenhar Cápsulas de Power-Up
      powerUps.forEach(p => {
        ctx.save();
        const color = p.type === 'WIDE' ? '#facc15' : p.type === 'MULTI' ? '#a855f7' : '#f43f5e';
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.roundRect(p.x - 18, p.y - 9, 36, 18, 6);
        ctx.fill();

        ctx.fillStyle = '#050811';
        ctx.font = 'bold 9px Orbitron, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type, p.x, p.y);
        ctx.restore();
      });

      // Desenhar Partículas
      particles.forEach(pt => {
        ctx.save();
        ctx.globalAlpha = pt.alpha;
        ctx.fillStyle = pt.color;
        ctx.shadowColor = pt.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      sfx.init();
      score = 0;
      lives = 3;
      level = 1;
      paddle.w = paddle.baseW;
      powerUps = [];
      particles = [];
      updateHUD();
      buildBricks();
      resetBall();
      isRunning = true;
      isPaused = false;
      overlay.classList.add('opacity-0', 'pointer-events-none');
    }

    function endGame() {
      isRunning = false;
      overlayIcon.className = 'fa-solid fa-skull text-rose-500';
      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.className = 'font-arcade text-3xl font-black text-rose-500 neon-text-pink';
      overlayDesc.innerHTML = `Você alcançou <span class="text-cyan-400 font-bold">${score}</span> pontos na Fase <span class="text-emerald-400 font-bold">${level}</span>!`;
      actionBtn.textContent = 'Jogar Novamente';
      overlay.classList.remove('opacity-0', 'pointer-events-none');
    }

    function togglePause() {
      if (!isRunning) return;
      isPaused = !isPaused;
      if (isPaused) {
        overlayIcon.className = 'fa-solid fa-pause text-amber-400';
        overlayTitle.textContent = 'JOGO PAUSADO';
        overlayTitle.className = 'font-arcade text-2xl font-black text-amber-400';
        overlayDesc.textContent = 'Clique no botão abaixo para continuar a partida.';
        actionBtn.textContent = 'Continuar';
        overlay.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        overlay.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    // Controles de Mouse e Touch no Canvas
    function movePaddleToClientX(clientX) {
      const rect = canvas.getBoundingClientRect();
      const relX = ((clientX - rect.left) / rect.width) * W;
      paddle.x = Math.max(8, Math.min(W - paddle.w - 8, relX - paddle.w / 2));
    }

    canvas.addEventListener('mousemove', e => {
      if (!isRunning || isPaused) return;
      movePaddleToClientX(e.clientX);
    });

    canvas.addEventListener('click', () => {
      if (isRunning && !isPaused) launchBalls();
    });

    canvas.addEventListener('touchmove', e => {
      if (!isRunning || isPaused) return;
      movePaddleToClientX(e.touches[0].clientX);
    }, { passive: true });

    canvas.addEventListener('touchstart', e => {
      if (!isRunning || isPaused) return;
      movePaddleToClientX(e.touches[0].clientX);
      launchBalls();
    }, { passive: true });

    // Controles de Teclado
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') paddle.dx = -paddle.speed;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') paddle.dx = paddle.speed;
      if (e.key === ' ') {
        e.preventDefault();
        if (isRunning && !isPaused) launchBalls();
      }
      if (e.key === 'p' || e.key === 'P') togglePause();
    });

    window.addEventListener('keyup', e => {
      if (
        e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' ||
        e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'
      ) {
        paddle.dx = 0;
      }
    });

    // Botões Mobile
    const leftTouchBtn = document.getElementById('leftTouchBtn');
    const rightTouchBtn = document.getElementById('rightTouchBtn');
    const launchTouchBtn = document.getElementById('launchTouchBtn');

    leftTouchBtn.addEventListener('touchstart', e => { e.preventDefault(); paddle.dx = -paddle.speed; });
    leftTouchBtn.addEventListener('touchend', () => { paddle.dx = 0; });
    rightTouchBtn.addEventListener('touchstart', e => { e.preventDefault(); paddle.dx = paddle.speed; });
    rightTouchBtn.addEventListener('touchend', () => { paddle.dx = 0; });
    launchTouchBtn.addEventListener('click', () => launchBalls());

    actionBtn.addEventListener('click', () => {
      if (isPaused) togglePause();
      else startGame();
    });

    document.getElementById('pauseBtn').addEventListener('click', togglePause);
    document.getElementById('soundBtn').addEventListener('click', () => {
      sfx.muted = !sfx.muted;
      document.getElementById('soundIcon').className = sfx.muted
        ? 'fa-solid fa-volume-xmark text-rose-400'
        : 'fa-solid fa-volume-high text-cyan-400';
    });

    window.onload = function () {
      buildBricks();
      resetBall();
      loop();
    };
  </script>
</body>
</html>
